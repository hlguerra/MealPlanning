<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />

  <meta name="theme-color" content="#D4622A" />
  <title>Haley's Meal Planning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet" />

</head>
<body>
  <div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#7A6A55;">Loading…</div></div>

  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase via ES module shim -->
  <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
  <script type="importmap">
  {
    "imports": {
      "firebase/app":       "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
      "firebase/auth":      "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"
    }
  }
  </script>

  <!-- Firebase init -->
  <script type="module">
    import { initializeApp } from "firebase/app";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "firebase/auth";
    import { initializeFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, runTransaction } from "firebase/firestore";

    const firebaseConfig = {
      apiKey:            "AIzaSyAGsLTqTtqJ_2ofBvzIHZ18rT74Ifj5MTw",
      authDomain:        "meal-planner-5df26.firebaseapp.com",
      projectId:         "meal-planner-5df26",
      storageBucket:     "meal-planner-5df26.firebasestorage.app",
      messagingSenderId: "591027849531",
      appId:             "1:591027849531:web:16799ab95c09098ebf8f1e",
    };

    const fb   = initializeApp(firebaseConfig);
    const db   = initializeFirestore(fb, { ignoreUndefinedProperties: true });
    const auth = getAuth(fb);

    // Each device signs in anonymously (persists across reloads). Firestore rules
    // and the AI proxy both key off this uid.
    const authReady = new Promise((resolve, reject) => {
      const unsub = onAuthStateChanged(auth, user => {
        if (user) { unsub(); resolve(user); }
        else signInAnonymously(auth).catch(err => { unsub(); reject(err); });
      });
    });

    const hhRef     = id        => doc(db, "households", id);
    const memberRef = (id, uid) => doc(db, "households", id, "members", uid);
    const dataRef   = (id, path) => doc(db, "households", id, ...path);
    const MISSING   = Symbol("missing");

    window.APP = window.APP || {};
    window.APP.firebase = {
      MISSING,
      authReady,
      getIdToken: async () => (await authReady).getIdToken(),

      // Live listener on one data doc. onData(value | MISSING).
      subscribe: (id, path, field, onData, onError) =>
        onSnapshot(dataRef(id, path), snap => {
          if (snap.metadata.hasPendingWrites) return; // our own local echo
          onData(snap.exists() && snap.data()[field] != null ? snap.data()[field] : MISSING);
        }, onError),

      // Read-merge-write in a transaction so a concurrent write from another
      // device is merged in rather than overwritten. merge(serverValue | MISSING) → value to write.
      mergeWrite: (id, path, field, merge) =>
        runTransaction(db, async tx => {
          const ref  = dataRef(id, path);
          const snap = await tx.get(ref);
          const value = merge(snap.exists() && snap.data()[field] != null ? snap.data()[field] : MISSING);
          tx.set(ref, { [field]: value, updatedAt: Date.now() });
          return value;
        }),

      // Makes this device a member of the household. The PIN is checked by the
      // Firestore rules. Returns false if the ID/PIN is wrong.
      ensureMember: async (id, pin) => {
        const { uid } = await authReady;
        try {
          if ((await getDoc(memberRef(id, uid))).exists()) return true;
        } catch (e) { if (e.code !== "permission-denied") throw e; }
        try {
          await setDoc(memberRef(id, uid), { pin: String(pin || ""), joinedAt: Date.now() });
        } catch (e) {
          if (e.code === "permission-denied") return false;
          throw e;
        }
        // Households created before PINs were stored server-side: claim it with this PIN
        const hh = await getDoc(hhRef(id));
        if (hh.exists() && !hh.data().pin) await updateDoc(hhRef(id), { pin: String(pin) });
        return true;
      },

      createHousehold: async (id, name, pin) => {
        const { uid } = await authReady;
        await setDoc(hhRef(id), { name, pin: String(pin), ownerUid: uid, createdAt: Date.now() });
        await setDoc(memberRef(id, uid), { pin: String(pin), joinedAt: Date.now() });
      },

      setHouseholdPin: (id, pin) => updateDoc(hhRef(id), { pin: String(pin) }),

      leaveHousehold: async id => {
        const { uid } = await authReady;
        await deleteDoc(memberRef(id, uid));
      },
    };
    window.APP.firebaseReady = true;
  </script>

  <!-- App modules in dependency order, all as text/babel -->
  <script type="text/babel" src="js/constants.js"></script>
  <script type="text/babel" src="js/utils.js"></script>
  <script type="text/babel" src="js/categorizer.js"></script>
  <script type="text/babel" src="js/hooks.js"></script>
  <script type="text/babel" src="js/sync.js"></script>
  <script type="text/babel" src="js/voting.js"></script>
  <script type="text/babel" src="js/components/ui.js"></script>
  <script type="text/babel" src="js/components/nav.js"></script>
  <script type="text/babel" src="js/screens/home.js"></script>
  <script type="text/babel" src="js/screens/recipes.js?v=7"></script>
  <script type="text/babel" src="js/screens/mealplan.js"></script>
  <script type="text/babel" src="js/screens/vote.js"></script>
  <script type="text/babel" src="js/screens/grocery.js"></script>
  <script type="text/babel" src="js/screens/pantry.js"></script>
  <script type="text/babel" src="js/screens/settings.js"></script>
  <script type="text/babel" src="js/app.js"></script>

</body>
</html>
